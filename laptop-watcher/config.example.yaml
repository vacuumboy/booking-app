# Скопируй в config.yaml и подправь под себя

check_interval_hours: 2

scan:
  max_pages_per_source: 2
  max_enrich_per_source: 60
  request_delay_sec: 0.3
  # Playwright для Dateks / AiO / Baltic Data. Отключить: LAPTOP_WATCHER_DISABLE_BROWSER=1
  # После каждого прогона слать короткий статус в Telegram
  notify_status: true

filters:
  max_price_eur: 900
  notify_on_price_drop: true
  min_refresh_hz: 120
  min_screen_inch: 14
  max_screen_inch: 15.6
  max_weight_kg: 1.55
  require_windows: true

  exclude_brands:
    - lenovo
    - dell

  exclude_keywords:
    - gaming
    - legion
    - rog
    - tuf
    - omen
    - victus
    - nitro
    - cyborg
    - raider
    - thinkpad
    - ideapad
    - yoga
    - spectre
    - elitebook
    - proart
    - zephyrus
    - rtx
    - geforce
    - loq
    - macbook

  refresh_keywords:
    - "120 hz"
    - "120hz"
    - "120 гц"

# Рабочие магазины с рассрочкой. Cloudflare-магазины выключены, пока браузер их не пробивает.
sources:
  euronics:
    enabled: true
  tet:
    enabled: true
    max_pages: 2
    max_enrich: 40
  dateks:
    enabled: true
    max_pages: 2
    max_enrich: 20
  aio:
    enabled: true
    max_pages: 2
    max_enrich: 20
  balticdata:
    enabled: true
    max_pages: 2
    max_enrich: 20
  m79:
    enabled: true
    max_pages: 3
    max_enrich: 40

  # Cloudflare challenge — Playwright пока не проходит (оставляем выкл.)
  "220":
    enabled: false
  rd:
    enabled: false
  "1a":
    enabled: false
  elkor:
    enabled: false
  signe:
    enabled: false
  kursi:
    enabled: false
  bigbox:
    enabled: false

  dateks_urls:
    enabled: true
    urls:
      - "https://www.dateks.lv/cenas/portativie-datori/1409772-asus-vivobook-s-14-oled-m5406wa-neutral-black-14-3k-oled-120hz-ryzen-ai-9-365-24gb-1tb-ssd-windows-11-home-openbox"
      - "https://www.dateks.lv/cenas/portativie-datori/1207471-hewlett-packard-pavilion-plus-14-ultra-5-125h-14-2-8k-oled-120hz-16gb-1tb-win11home-srebrny"
