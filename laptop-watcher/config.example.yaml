# Скопируй в config.yaml и подправь под себя
# Настройки также меняются кнопками в Telegram-боте (/settings)

check_interval_hours: 2

scan:
  # null = без лимита (открываем все страницы / все карточки после бренд-фильтров)
  max_pages_per_source: null
  max_enrich_per_source: null
  request_delay_sec: 0.25
  notify_status: true
  # Топ ближайших к фильтрам (цена + Hz + диагональ) в Telegram после прогона
  closest_top: 5
  notify_closest: true
  # Насколько можно вылезти за max_price, чтобы ещё считаться «близко»
  closest_max_over_eur: 250
  # Если на карточке нет Hz, но остальное подходит — ищем частоту в интернете по MPN/названию
  web_hz_lookup: true
  max_web_hz_lookups: 25
  web_hz_delay_sec: 1.0

filters:
  max_price_eur: 900
  # Ниже — считаем лизингом/ошибкой парсера (Tet «от 1€»)
  min_price_eur: 250
  notify_on_price_drop: true
  min_refresh_hz: 120
  min_screen_inch: 14
  max_screen_inch: 15.6
  # max_weight_kg: 1.55
  require_windows: true

  # reject = нет Hz → мимо
  # accept = нет Hz на карточке → всё равно рассматриваем
  # (база specs/seed.yaml дополняет Hz по коду модели)
  unknown_refresh_policy: reject

  exclude_brands:
    - lenovo
    - dell

  exclude_keywords:
    - gaming
    - legion
    - rog
    - tuf
    - omen
    - victus
    - nitro
    - cyborg
    - raider
    - thinkpad
    - ideapad
    - yoga
    - spectre
    - elitebook
    - proart
    - zephyrus
    - rtx
    - geforce
    - loq
    - macbook

  refresh_keywords:
    - "120 hz"
    - "120hz"
    - "120 гц"

sources:
  euronics:
    enabled: true
  tet:
    enabled: true
  dateks:
    enabled: true
  aio:
    enabled: false  # Playwright часто ловит 403 на карточках
  balticdata:
    enabled: true
  m79:
    enabled: true

  "220":
    enabled: false
  rd:
    enabled: false
  "1a":
    enabled: false
  elkor:
    enabled: false
  signe:
    enabled: false
  kursi:
    enabled: false
  bigbox:
    enabled: false

  dateks_urls:
    enabled: true
    urls:
      - "https://www.dateks.lv/cenas/portativie-datori/1409772-asus-vivobook-s-14-oled-m5406wa-neutral-black-14-3k-oled-120hz-ryzen-ai-9-365-24gb-1tb-ssd-windows-11-home-openbox"
      - "https://www.dateks.lv/cenas/portativie-datori/1207471-hewlett-packard-pavilion-plus-14-ultra-5-125h-14-2-8k-oled-120hz-16gb-1tb-win11home-srebrny"
