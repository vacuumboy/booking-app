# Известные модели: только конкретные MPN/SKU → спеки.
# Не пиши общие имена вроде "Zenbook 14 OLED" — у одной линейки бывает и 60, и 120 Hz.
# Пополняй вручную. refresh_hz / is_gaming используются при матче по коду из title/URL.

models:
  # HP Pavilion Plus 14 OLED 120Hz
  - codes: ["14-ew1000", "14-ew1010", "14-ew1020", "14-ew0053"]
    brand: HP
    model: Pavilion Plus 14 OLED
    refresh_hz: 120
    screen_inch: 14.0
    weight_kg: 1.44
    is_gaming: false
    notes: "OLED 2.8K 120Hz"

  - codes: ["14-ey0000", "14-ey0010"]
    brand: HP
    model: Pavilion Plus 14
    refresh_hz: 120
    screen_inch: 14.0
    weight_kg: 1.4
    is_gaming: false

  # ASUS Vivobook S14 OLED 120Hz (конкретные MPN)
  - codes: ["M5406WA", "M5406UA", "M5406NA"]
    brand: ASUS
    model: Vivobook S 14 OLED
    refresh_hz: 120
    screen_inch: 14.0
    weight_kg: 1.2
    is_gaming: false
    notes: "3K OLED 120Hz"

  # ASUS Zenbook 14 OLED — 60 Hz WUXGA SKU (Euronics UX3405CA-QL219W)
  - codes: ["UX3405CA-QL219W", "90NB14W4-M00880"]
    brand: ASUS
    model: Zenbook 14 OLED UX3405CA-QL219W
    refresh_hz: 60
    screen_inch: 14.0
    weight_kg: 1.28
    is_gaming: false
    notes: "WUXGA OLED 60Hz (not the 3K panel)"

  # ASUS Zenbook 14 OLED — известные 120 Hz (3K) SKU, если появятся в каталоге
  - codes: ["UX3405CA-PP151W", "UX3405CA-PP152W", "UX3405MA"]
    brand: ASUS
    model: Zenbook 14 OLED 3K
    refresh_hz: 120
    screen_inch: 14.0
    weight_kg: 1.2
    is_gaming: false
    notes: "3K OLED 120Hz"

  # Acer Swift / Aspire AI — только явные коды серии
  - codes: ["SF14-51"]
    brand: Acer
    model: Swift 14 AI
    refresh_hz: 120
    screen_inch: 14.0
    weight_kg: 1.3
    is_gaming: false

  # Known 60Hz office machines
  - codes: ["8A670EA", "255 G10"]
    brand: HP
    model: 255 G10
    refresh_hz: 60
    screen_inch: 15.6
    weight_kg: 1.52
    is_gaming: false

  - codes: ["82XQ013ALT"]
    brand: Lenovo
    model: IdeaPad Slim 3 15AMN8
    refresh_hz: 60
    screen_inch: 15.6
    weight_kg: 1.62
    is_gaming: false

  # Gaming family markers (short whole-word only)
  - codes: ["LOQ", "Legion", "TUF", "ROG", "Cyborg", "Katana", "Raider", "Omen", "Victus", "Nitro"]
    brand: various
    model: Gaming family
    refresh_hz: 144
    is_gaming: true
